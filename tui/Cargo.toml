[package]
name = "stask"
description = "A keyboard-driven TUI task manager: a task tree of unlimited depth, custom statuses, and Markdown notes edited in $EDITOR"
keywords = ["tui", "task", "todo", "terminal", "ratatui"]
categories = ["command-line-utilities"]
readme = "../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "stask"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
engine = { package = "stask-engine", version = "1.1.0", path = "../engine" }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = "1.1.6"
unicode-width = "0.2.2"
